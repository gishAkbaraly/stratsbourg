<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#8E2F3C">
<title>Strasbourg 16–18 nov</title>
<style>
:root{--bg:#F2F4F3;--surface:#fff;--ink:#1B2422;--muted:#5D6B68;--line:#DCE2E0;--gres:#8E2F3C;--ill:#1F6E6A}
@media (prefers-color-scheme:dark){:root{--bg:#111716;--surface:#1A2220;--ink:#E8EEEC;--muted:#9AA8A5;--line:#2B3633;--gres:#E07E8A;--ill:#6CC2BB;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:24px;color:var(--gres)}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{width:100%;font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font-size:16px;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--ill);color:#fff;cursor:pointer}
#err{color:var(--gres);font-weight:600;min-height:1.2em}
</style></head><body>
<form id="f">
  <h1>Strasbourg</h1>
  <p>Plan de visite du 16 au 18 novembre. Page privée : entre le mot de passe.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" required autofocus>
  <label class="rem"><input id="rem" type="checkbox" checked> Se souvenir sur ce téléphone</label>
  <button type="submit">Ouvrir</button>
  <div id="err" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  const html=await unlock(pw);
  try{ if(remember) localStorage.setItem("stx-pw",pw); }catch(e){}
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const err=document.getElementById("err"); err.textContent="";
  try{ await go(document.getElementById("pw").value, document.getElementById("rem").checked); }
  catch(x){ err.textContent="Mot de passe incorrect."; }
});
(async()=>{ let pw=null; try{pw=localStorage.getItem("stx-pw");}catch(e){}
  if(pw){ try{ await go(pw,true); }catch(e){ try{localStorage.removeItem("stx-pw");}catch(_){} } } })();
